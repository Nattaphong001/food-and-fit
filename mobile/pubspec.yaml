name: myapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.64.0

  # State Management & Navigation
  get: ^4.6.6
  get_storage: ^2.1.1
  flutter_secure_storage: ^9.2.2
  
  # Networking
  dio: ^5.4.0
  http: ^1.2.0
  
  # Local Notifications
  awesome_notifications: ^0.11.0

  # Utilities
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  email_validator: ^2.1.17
  image_picker: ^1.0.7
  video_player: ^2.9.2
  chewie: ^1.8.5
  cached_network_image: ^3.4.1
  flutter_inappwebview: ^6.1.5
  pdf: ^3.10.8
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  